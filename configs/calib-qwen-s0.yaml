# Phase-1b calibration: replicate arXiv 2606.27634's core protocol.
#
# Every value below is quoted from the paper (fetched and read 2026-08-09), not
# inferred. This file is the executable record of what we claim to have
# replicated — if a value here is wrong, the calibration is meaningless, so
# change nothing without re-reading the source.
#
# Paula, Kupssinskü & Barros, "Continual Learning for Sequential Personalization
# of Small Language Models: A Stability Monitoring Analysis".
run_name: calib-paper-qwen-s0

# meta-llama/Llama-3.2-1B-Instruct is gated: manual and this box is not
# approved. unsloth's mirror is byte-identical to Meta's release — the digest
# below is Meta's own published sha256, checked on load. If it ever stops
# matching, the run must fail rather than quietly train on different weights.
model: Qwen/Qwen3.5-0.8B
model_sha256: 04b1c301231dd422b8860db31311ab2721511346a32cb1e079c4c4e5f1fe4696

# They use the 500-example variant, not the 5000 we default to.
trace_variant: LLM-CL-Benchmark_500
seed: 0
mode: lora
optim: adamw_torch          # AdamW, reset per task (a fresh trainer per stage)

# Their order. NumGLUE-cm is third and so carries the most forgetting signal,
# on the smallest held-out set in TRACE (41 eval) — quote n beside its numbers.
stages:
  - {task: FOMC,       epochs: 1, learning_rate: 5.0e-5}
  - {task: ScienceQA,  epochs: 1, learning_rate: 5.0e-5}
  - {task: NumGLUE-cm, epochs: 1, learning_rate: 5.0e-5}

lora:
  r: 8
  alpha: 16
  dropout: 0.05
  bias: none
  # NOT our seven named modules — a different adapted set, not a smaller one.
  target_modules: all-linear

train:
  batch_size: 2
  grad_accum: 8             # = 16 effective, as theirs
  max_length: 512
  lr_scheduler: cosine

probe:
  tasks: all
  n_eval: 200               # clamps to 41 on NumGLUE-cm, and says so
  max_length: 512           # matches training
  # Llama's vocab is 128256 vs SmolLM2's 49152 and probe memory is
  # logit-dominated, so this is set deliberately rather than inherited.
  batch_size: 2
