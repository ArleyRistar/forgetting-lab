# REPLICATION MODE — arXiv 2606.27634, Llama 3.2 1B Instruct, their seed 33.
#
# Every value here is taken from their published implementation
# (github.com/tspthomas/slm_stability_cl, HEAD 801a3b3), not from the paper
# text, which leaves most of it unstated. This file exists to check our harness
# against their published numbers. Phase 2 runs in OUR configuration — what is
# being validated here is the harness, not the prompt format.
run_name: repl-qwen-s33

model: Qwen/Qwen3.5-0.8B
model_sha256: 04b1c301231dd422b8860db31311ab2721511346a32cb1e079c4c4e5f1fe4696
trace_variant: LLM-CL-Benchmark_500
seed: 33                      # theirs are 33 / 42 / 123

mode: lora
optim: adamw_torch            # created fresh per task; we assert the state is empty

# --- the four replication knobs -------------------------------------------
# Their chat-template render: "{task_prompt}\n\n{prompt}" as one user turn, no
# system message, add_generation_prompt=True. Task prompts are Qwen's documented
# defaults, which they apply to every model.
prompt_style: paper
# THE correction. They score ONE next-token position per reference example -
# the distribution right after the prompt. We were averaging ~300 answer tokens,
# which dilutes the divergence and is almost certainly the whole 4-8x gap.
kl_scope: next_token
# Their R is 20% carved from each task's eval split (48 examples for _500),
# not a separate corpus. Task-distributed rather than generic.
reference: task_eval
# They score on test.json; eval.json is where the reference set came from.
eval_split: test

stages:
  - {task: FOMC,       epochs: 1, learning_rate: 5.0e-5}
  - {task: ScienceQA,  epochs: 1, learning_rate: 5.0e-5}
  - {task: NumGLUE-cm, epochs: 1, learning_rate: 5.0e-5}

lora:
  r: 8
  alpha: 16
  dropout: 0.05
  bias: none
  target_modules: all-linear

train:
  batch_size: 2
  grad_accum: 8               # = 16 effective
  max_length: 512
  lr_scheduler: constant      # they use NO scheduler...
  completion_only: true       # they mask the prompt; phase 1a did not
  warmup_steps: 0             # ...and no warmup

probe:
  tasks: all
  n_eval: 200                 # clamps per task and reports the real n
  max_length: 512
  batch_size: 2
  reference_n: 48             # ignored for reference: task_eval, which sets its own size
