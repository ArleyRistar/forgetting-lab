[project]
name = "flab"
version = "0.1.0"
description = "forgetting-lab: catastrophic forgetting in ternary LLMs"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.6",
    "transformers>=4.51",
    "datasets>=3.2",
    "peft>=0.14",
    "trl>=0.20",
    "accelerate>=1.2",
    "lm-eval[ifeval]>=0.4.8",
    "tensorboard>=2.18",
    "bitsandbytes>=0.50.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flab"]
